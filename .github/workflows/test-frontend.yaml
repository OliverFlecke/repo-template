name: Test - frontend

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.4
        with:
          install_args: dotnet node pnpm

      # Generates api/Api/openapi.json, which the frontend build consumes to
      # generate its API client. Doesn't need the database or any other
      # backing service, see the `GetDocument.Insider` branch in Program.cs.
      - name: Generate OpenAPI spec
        working-directory: api/Api
        run: dotnet build

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: frontend
        run: pnpm build:api

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14