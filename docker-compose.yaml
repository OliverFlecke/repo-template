---
name: repo-template
services:
  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: app
    restart: unless-stopped

  # Applies outstanding Marten/Wolverine schema changes before the api
  # starts. ResourceAutoCreate is off in Production (see Program.cs), so
  # this explicit step is required - it's a no-op once the schema is
  # up to date.
  api-migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api-migrate
    depends_on:
      db:
        condition: service_healthy
      openfga-setup:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Host=db
      - Database__Port=5432
      - Database__Username=postgres
      - Database__Password=postgres
      - Database__Database=postgres
      - OpenFga__Host=http://openfga:8080
    volumes:
      - ./tmp/openfga:/shared:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -a
        [ -f /shared/openfga.env ] && . /shared/openfga.env
        set +a
        exec ./Api db-apply

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      openfga-setup:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Host=db
      - Database__Port=5432
      - Database__Username=postgres
      - Database__Password=postgres
      - Database__Database=postgres
      - OpenFga__Host=http://openfga:8080
      - Auth0__Host=${AUTH0_HOST}
      - Auth0__ClientId=${AUTH0_CLIENT_ID}
      - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET}
      - Cors__AllowedOrigins__0=https://localhost:3000
    volumes:
      - ./tmp/openfga:/shared:ro
    # OpenFga__StoreId/ModelId are generated at runtime by openfga-setup, so
    # they can't be baked in as static env vars (Compose reads `env_file:`
    # before any container runs, which is too early - the file wouldn't
    # exist yet on a fresh checkout). Source them from the shared file once
    # openfga-setup has written it, then hand off to the real entrypoint.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -a
        [ -f /shared/openfga.env ] && . /shared/openfga.env
        set +a
        exec ./Api

  # Terminates HTTPS in front of app/api using the mkcert certificate from
  # frontend/certificates/ (see Caddyfile). Run `mkcert localhost 127.0.0.1
  # ::1` in that directory first if it doesn't exist yet.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    depends_on:
      - app
      - api
    ports:
      # 3000 is left free for a locally-run `pnpm dev` frontend.
      - "127.0.0.1:4000:4000"
      # - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/certificates:/certs:ro
    restart: unless-stopped

  # TODO: need to consider whether to use this or some S3 compatable mock
  # Emulator for Azure Storage, used for local file uploads instead of sending
  # files to an actual server.
  # azurite:
  #   image: mcr.microsoft.com/azure-storage/azurite:3.35.0
  #   container_name: azurite
  #   volumes:
  #     - ./tmp/data:/data
  #   ports:
  #     - "127.0.0.1:10000:10000"
  #     - "127.0.0.1:10001:10001"
  #     - "127.0.0.1:10002:10002"
  #   command: "azurite --blobHost 0.0.0.0 --debug /data/debug.log --skipApiVersionCheck"
  #   restart: unless-stopped
  #   hostname: azurite

  db:
    image: postgres:18-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Gives OpenFGA its own database on this same postgres instance. Only
      # runs on first init of an empty data directory, which matches this
      # service since it has no persistent volume of its own.
      - ./libs/OpenFGA/init-db.sql:/docker-entrypoint-initdb.d/init-openfga-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # FastAPI wrapper around the FLARE server's admin API (see flare-api/README.md).
  # Requires the FLARE federation to already be running - it joins that
  # project's external network (see flare/workspace/mip/prod_00/compose.yaml)
  # and mounts its admin startup kit + job definitions. Without it, this
  # service (and `docker compose up` for the whole file) fails to start.
  flare-api:
    build:
      context: ./flare-api
    container_name: flare-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./flare/workspace/mip/prod_00/admin@flecke.xyz:/admin:ro
      # not :ro - submit_job() writes a signature file into the job folder
      - ./flare/jobs:/jobs
      # rw - provisionClient adds participants and re-provisions into these
      - ./flare/project.yml:/flare-project/project.yml
      - ./flare/workspace:/flare-project/workspace
    networks:
      - flare

  # Jaeger is used to collect OpenTelemetry. Visit the UI port to see traces
  # for the various applications.
  # jaeger:
  #   image: jaegertracing/all-in-one:2.20.0
  #   container_name: jaeger
  #   environment:
  #     COLLECTOR_ZIPKIN_HOST_PORT: 9412
  #     COLLECTOR_OTLP_ENABLED: "true"
  #     QUERY_BASE_PATH: /telemetry
  #   ports:
  #     - "127.0.0.1:4317:4317"
  #     - "127.0.0.1:4318:4318"
  #     - "127.0.0.1:16686:16686"
  #   restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Required for a single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:9092:9092"
    restart: unless-stopped
  kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    ports:
      - "127.0.0.1:9090:8080"

  # Runs OpenFGA's schema migration against its database on the shared
  # postgres instance before the server starts.
  openfga-migrate:
    image: openfga/openfga:v1.18
    container_name: openfga-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@db:5432/openfga?sslmode=disable
    command: migrate

  openfga:
    image: openfga/openfga:v1.18
    container_name: openfga
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@db:5432/openfga?sslmode=disable
      - OPENFGA_LOG_FORMAT=json
    ports:
      - "127.0.0.1:6080:8080" # Needed for the http server
      - "127.0.0.1:6081:8081" # Needed for the grpc server (if used)
    restart: unless-stopped
    command: run

  # One-shot job that creates (or reuses) the OpenFGA store and writes the
  # authorization model from libs/OpenFGA/fga.mod, then hands the resulting
  # store/model ids to the api container via a shared file (see api's
  # entrypoint override above).
  openfga-setup:
    build:
      context: ./libs/OpenFGA/setup
    container_name: openfga-setup
    depends_on:
      - openfga
    environment:
      - FGA_API_URL=http://openfga:8080
    volumes:
      - ./libs/OpenFGA:/model:ro
      - ./tmp/openfga:/shared

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  flare:
    name: flare_default
    external: true