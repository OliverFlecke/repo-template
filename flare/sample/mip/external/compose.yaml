---
name: external-flare-client
services:
  external:
    build: nvflare_compose_client
    container_name: external
    volumes:
      - ./external-01:/workspace
      - external_data:/data
    environment:
      NVFLARE_CLIENT_NAME: external
      NVFLARE_ORG: maritime
    ports:
      - "127.0.0.1:8094:8080"
    networks:
      - flare

networks:
  flare:
    name: prod_00_default
    external: true

volumes:
  external_data: null